plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}") {
        transitive = false
    }
    mappings files('mapping/yarn-1.21.11+build-special-v5.local-v2.jar')

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files("../slimefunhelper-1.21.11/build/libs/SlimefunHelper-1.21.11-beta-${project.slimefunhelper_version}.jar")
}

def generatedModVersion = project.version
def generatedMinecraftVersion = project.minecraft_version

processResources {
    inputs.property 'version', generatedModVersion
    inputs.property 'minecraft_version', generatedMinecraftVersion

    filesMatching('fabric.mod.json') {
        expand(
                'version': generatedModVersion,
                'minecraft_version': generatedMinecraftVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
